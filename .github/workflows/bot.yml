name: GiaThuocSi Bot Daily Run

on:
  schedule:
    - cron: '0 9 * * *'  # Run at 9:00 AM UTC every day
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Create .env from secrets
      run: |
        echo "THUOCSI_USERNAME=${{ secrets.THUOCSI_USERNAME }}" > .env
        echo "THUOCSI_PASSWORD=${{ secrets.THUOCSI_PASSWORD }}" >> .env
        echo "SCHEDULE_HOUR=9" >> .env
        echo "SCHEDULE_MINUTE=0" >> .env
        echo "EXCEL_FILE=./data/prices.xlsx" >> .env

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Run price scraper
      run: python test_scraper.py

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add -A
        git commit -m "Auto: Update prices on $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push || echo "Nothing to push"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
